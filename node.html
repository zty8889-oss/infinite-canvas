<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AI漫剧节点工作台 · Node Canvas</title>
<style>
  :root{
    --grid:#e7ebe8; --grid2:#d7ded9; --bg:#f1f3f1; --panel:#fbfcfb; --line:#d9dfdc;
    --txt:#202724; --muted:#77827c; --accent:#317f70; --shadow:0 8px 24px rgba(25,36,31,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  #viewport{position:fixed;inset:0;background-color:var(--bg);
    background-image:
      linear-gradient(to right,var(--grid) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid) 1px,transparent 1px),
      linear-gradient(to right,var(--grid2) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid2) 1px,transparent 1px);
    cursor:grab;touch-action:none;overflow:hidden}
  #viewport.panning{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
  #edges path.wire{fill:none;stroke:#8ea7c2;stroke-width:2.5;vector-effect:non-scaling-stroke}
  #edges path.temp{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
  #nodes{position:absolute;left:0;top:0}

  .nd{position:absolute;width:230px;background:#fff;border:1px solid rgba(0,0,0,.08);
    border-radius:12px;box-shadow:var(--shadow);user-select:none;touch-action:none;display:flex;flex-direction:column}
  .nd.selected{outline:2px solid var(--accent);outline-offset:2px}
  .nd .hd{display:flex;align-items:center;gap:6px;padding:7px 9px;color:#fff;font-size:13px;
    border-radius:11px 11px 0 0;cursor:move}
  .nd .hd .ic{font-size:14px}
  .nd .hd .ti{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nd .hd .st{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);flex:0 0 auto}
  .nd .hd .st.run{background:#fde047;animation:blink 1s infinite}
  .nd .hd .st.done{background:#4ade80}
  .nd .hd .st.err{background:#f87171}
  @keyframes blink{50%{opacity:.3}}
  .nd .hd .del,.nd .hd .col{border:none;background:rgba(255,255,255,.22);color:#fff;width:19px;height:19px;
    border-radius:6px;cursor:pointer;font-size:13px;line-height:1;flex:0 0 auto}
  .nd .hd .del:hover,.nd .hd .col:hover{background:rgba(255,255,255,.45)}
  .nd .bd{padding:8px;font-size:12px;color:#475569;display:flex;flex-direction:column;gap:6px}
  .nd .sum{max-height:64px;overflow:hidden;line-height:1.4;white-space:pre-wrap;word-break:break-word;color:#334155}
  .nd .res img,.nd .res video{width:100%;border-radius:8px;display:block;background:#f1f5f9}
  .nd .res audio{width:100%}
  .nd .res .txtout{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px;max-height:120px;
    overflow:auto;white-space:pre-wrap;font-size:12px;color:#0f172a}
  .nd .ft{display:flex;gap:6px;padding:0 8px 8px}
  .nd .run{flex:1;border:none;border-radius:8px;background:#111827;color:#fff;padding:6px;font-size:12px;cursor:pointer}
  .nd .run:hover{background:#0b1220}
  .nd .run[disabled]{opacity:.5;cursor:default}
  .nd .prov{margin-left:auto;font-size:10px;color:#94a3b8;align-self:center;padding-right:8px}
  .nd .nhandle{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:4px;background:#fff;
    border:2px solid var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.25);cursor:nwse-resize;display:none;z-index:6;touch-action:none}
  .nd:hover .nhandle,.nd.selected .nhandle{display:block}
  .nd.collapsed .bd,.nd.collapsed .ft{display:none}
  .port{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #8ea7c2;
    top:50%;margin-top:-7px;cursor:crosshair;z-index:5}
  .port.in{left:-8px}
  .port.out{right:-8px;background:#8ea7c2}
  .port:hover{border-color:var(--accent);background:var(--accent)}
  .port.out:hover{background:var(--accent)}

  /* 分组框 */
  .gframe{position:absolute;border-radius:16px;pointer-events:none;z-index:0;
    border:1.5px dashed rgba(59,130,246,.6);background:rgba(59,130,246,.06)}
  .gframe.selected{outline:2px solid var(--accent);outline-offset:2px}
  .gframe .ghd{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:move;
    font-size:12.5px;font-weight:600;color:#1e3a8a;background:rgba(255,255,255,.66);border-radius:15px 15px 0 0}
  .gframe .ghd .gcount{font-weight:400;color:#64748b;font-size:11px}
  .gframe .gbtn{margin-left:4px;border:none;background:rgba(59,130,246,.15);color:#1e3a8a;border-radius:6px;
    width:20px;height:20px;cursor:pointer;font-size:13px;line-height:1}
  .gframe .gbtn:first-of-type{margin-left:auto}
  .gframe .ghandle{pointer-events:auto;position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);cursor:nwse-resize;display:none}
  .gframe.selected .ghandle{display:block}

  #toolbar{position:fixed;left:12px;top:12px;z-index:30;display:flex;flex-wrap:wrap;gap:5px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);max-width:72vw}
  #toolbar button{border:1px solid transparent;background:#f1f4f9;border-radius:8px;padding:6px 10px;
    font-size:12.5px;cursor:pointer;color:var(--txt);white-space:nowrap}
  #toolbar button:hover{background:#e6ecf5}
  #toolbar button.active{background:var(--accent);color:#fff}
  #toolbar .brand{font-weight:700;padding:6px 8px;color:#334155}
  #toolbar .sep{width:1px;background:var(--line);margin:2px 1px}
  #toolbar .api-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c7ceca;margin-right:5px;
    vertical-align:1px;box-shadow:0 0 0 2px #edf1ef}
  #toolbar .api-dot.ready{background:#32a17b;box-shadow:0 0 0 2px #e4f4ed}

  #inspector{position:fixed;right:0;top:0;bottom:0;width:320px;max-width:88vw;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-6px 0 22px rgba(20,30,50,.06);z-index:25;
    transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
  #inspector.open{transform:none}
  #inspector .ih{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  #inspector .ih .t{font-weight:700;flex:1}
  #inspector .ib{padding:12px 14px;overflow:auto;flex:1}
  #inspector .fl{margin-bottom:10px}
  #inspector label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
  #inspector input,#inspector select,#inspector textarea{width:100%;font-family:inherit;font-size:13px;
    border:1px solid #dbe2ea;border-radius:8px;padding:7px 9px;background:#fbfcfe;outline:none;color:var(--txt)}
  #inspector textarea{resize:vertical;min-height:64px}
  #inspector input:focus,#inspector select:focus,#inspector textarea:focus{border-color:var(--accent);background:#fff}
  #inspector .btn{width:100%;border:none;border-radius:9px;background:#111827;color:#fff;padding:10px;
    font-size:14px;cursor:pointer;margin-top:6px}
  #inspector .btn.ghost{background:#eef2f7;color:#334155}
  #inspector .btn:disabled{opacity:.5}
  #inspector .log{font-size:11px;color:#94a3b8;margin-top:8px;white-space:pre-wrap;max-height:120px;overflow:auto}
  #inspector .pill{display:inline-block;font-size:11px;background:#eef2ff;color:#4338ca;border-radius:999px;padding:2px 8px;margin-left:6px}
  #inspector .close{border:none;background:#f1f4f9;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:16px}

  #menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:8px;display:none;width:300px}
  #menu.on{display:block}
  #menu .mt{font-size:12px;color:var(--muted);padding:2px 6px 6px}
  #menu .mg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #menu .mi{display:flex;align-items:center;gap:8px;border:1px solid #e6ecf3;border-radius:9px;padding:8px;
    font-size:13px;cursor:pointer;background:#fbfcfe}
  #menu .mi:hover{background:#eef4fc;border-color:#c9dcf5}
  #menu .mi .ico{font-size:17px}

  #modal{position:fixed;inset:0;z-index:70;background:rgba(18,26,23,.52);display:none;padding:24px}
  #modal.on{display:flex;align-items:center;justify-content:center}
  #modal .box{background:#f7f9f7;border:1px solid rgba(255,255,255,.5);border-radius:14px;
    width:min(1060px,96vw);height:min(780px,92vh);overflow:hidden;box-shadow:0 24px 70px rgba(13,22,18,.24);
    display:flex;flex-direction:column}
  #modal .mh{height:64px;padding:0 18px 0 22px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:12px;background:#fff;flex:0 0 auto}
  #modal .mh .mh-title{display:flex;flex-direction:column;gap:2px;min-width:0}
  #modal .mh strong{font-size:15px;letter-spacing:0;color:#1c2823;white-space:nowrap}
  #modal .mh small{font-size:11px;color:#8a968f;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #modal .mh-spacer{flex:1}
  #modal .mh .close,#modal .mh .back{border:1px solid #dfe6e1;background:#f8faf8;border-radius:7px;
    height:32px;cursor:pointer;color:#35443d}
  #modal .mh .close{width:32px;font-size:18px}
  #modal .mh .back{display:none;padding:0 11px;font-size:12px}
  #modal .mh .back.on{display:block}
  #modal .mb{flex:1;min-height:0;overflow:hidden}
  .api-shell{height:100%;min-width:0;display:grid;grid-template-columns:172px minmax(0,1fr)}
  .api-rail{background:#eef2ef;border-right:1px solid #dce3df;padding:16px 10px;overflow:auto}
  .api-rail-label{font-size:10px;font-weight:750;letter-spacing:.1em;color:#849089;padding:0 10px 8px}
  .api-filter{width:100%;height:38px;border:none;background:transparent;color:#536159;border-radius:7px;
    display:flex;align-items:center;gap:9px;padding:0 10px;margin-bottom:3px;cursor:pointer;text-align:left;font-size:13px}
  .api-filter:hover{background:rgba(255,255,255,.68)}
  .api-filter.on{background:#fff;color:#18392f;box-shadow:0 2px 8px rgba(28,49,40,.07);font-weight:700}
  .api-filter .count{margin-left:auto;font-size:10px;color:#87938c;background:#e1e7e3;border-radius:99px;padding:1px 6px}
  .api-filter.on .count{background:#e2f1eb;color:#21705b}
  .api-rail-note{margin:18px 8px 0;padding:12px;border:1px solid #d8e2dc;border-radius:8px;
    color:#77857d;font-size:11px;line-height:1.6;background:rgba(255,255,255,.45)}
  .api-main{min-width:0;overflow:auto;padding:22px 24px 28px}
  .api-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
  .api-top-copy{flex:1;min-width:0}
  .api-top h2{margin:0 0 5px;font-size:20px;letter-spacing:0;color:#17231e}
  .api-top p{margin:0;color:#7d8982;font-size:12px;line-height:1.5}
  .api-search{width:230px;height:36px;border:1px solid #d7dfda;border-radius:8px;background:#fff;
    padding:0 11px;outline:none;font-size:12px;color:#24312b}
  .api-search:focus{border-color:#6f9e8c;box-shadow:0 0 0 3px rgba(49,127,112,.08)}
  .api-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
  .api-summary-item{background:#fff;border:1px solid #e0e6e2;border-radius:9px;padding:12px 14px}
  .api-summary-item b{display:block;font-size:20px;line-height:1.1;color:#1d2b25}
  .api-summary-item span{display:block;margin-top:5px;font-size:11px;color:#87928c}
  .api-grid{display:grid;min-width:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .api-card{appearance:none;text-align:left;min-width:0;width:100%;min-height:148px;background:#fff;border:1px solid #dfe6e2;
    border-radius:10px;padding:15px;cursor:pointer;display:flex;flex-direction:column;color:var(--txt);
    transition:border-color .15s,box-shadow .15s,transform .15s}
  .api-card:hover{border-color:#a9c2b8;box-shadow:0 8px 24px rgba(24,48,38,.09);transform:translateY(-1px)}
  .api-card-head{display:flex;align-items:center;gap:11px;min-width:0}
  .api-logo{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;font-size:15px;font-weight:800;color:#fff;background:#52655c}
  .api-title-wrap{min-width:0;flex:1}
  .api-title-wrap h3{margin:0;font-size:14px;line-height:1.35;color:#1d2a24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .api-title-wrap p{margin:3px 0 0;font-size:11px;color:#87928c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .api-status{width:8px;height:8px;border-radius:50%;background:#c3cbc6;flex:0 0 auto;box-shadow:0 0 0 3px #f2f5f3}
  .api-status.ready{background:#36a27e;box-shadow:0 0 0 3px #e8f5f0}
  .api-status.pending{background:#d49a35;box-shadow:0 0 0 3px #fbf4e8}
  .api-card-desc{font-size:11.5px;color:#6f7c75;line-height:1.5;margin:12px 0 10px;min-height:34px}
  .api-card-foot{margin-top:auto;display:flex;align-items:center;gap:7px}
  .api-chip{font-size:10px;padding:3px 7px;border-radius:5px;background:#eff3f1;color:#5d6b64;white-space:nowrap}
  .api-chip.current{background:#e8f5ef;color:#266e59}
  .api-open{margin-left:auto;color:#27735f;font-size:11px;font-weight:700}
  .api-empty{grid-column:1/-1;padding:62px 24px;text-align:center;color:#89958e;background:#fff;
    border:1px dashed #d8e1dc;border-radius:10px;font-size:13px}
  .api-detail{height:100%;overflow:auto;padding:22px 26px 30px}
  .api-detail-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .api-detail-logo{width:52px;height:52px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:20px;font-weight:800}
  .api-detail-title{flex:1;min-width:0}
  .api-detail-title h2{margin:0 0 4px;font-size:19px;color:#18251f}
  .api-detail-title p{margin:0;color:#7f8a84;font-size:12px;line-height:1.5}
  .api-health{font-size:11px;padding:5px 9px;border-radius:99px;background:#eef2f0;color:#68756e;white-space:nowrap}
  .api-health.ready{background:#e7f5ef;color:#227058}
  .api-health.pending{background:#fff4e3;color:#966719}
  .api-help{background:#edf4f1;border:1px solid #d7e5df;color:#52665d;border-radius:8px;
    padding:10px 12px;font-size:11.5px;line-height:1.65;margin-bottom:16px}
  .api-section{background:#fff;border:1px solid #dfe6e2;border-radius:10px;padding:16px;margin-bottom:12px}
  .api-section-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;font-weight:750;color:#2a3932}
  .api-section-title span{font-size:10px;font-weight:400;color:#8b9690}
  .api-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
  .api-field{min-width:0}
  .api-field.full{grid-column:1/-1}
  .api-field label{font-size:11px;color:#65736c;display:block;margin-bottom:5px}
  .api-input-wrap{position:relative}
  #modal .api-field input,#modal .api-field select,#modal .api-field textarea{width:100%;font-family:inherit;
    font-size:12.5px;border:1px solid #d7dfda;border-radius:7px;padding:8px 10px;background:#fbfcfb;
    outline:none;color:#1f2d27}
  #modal .api-field textarea{resize:vertical;min-height:92px;line-height:1.5}
  #modal .api-field input:focus,#modal .api-field select:focus,#modal .api-field textarea:focus{
    border-color:#6e9e8b;background:#fff;box-shadow:0 0 0 3px rgba(49,127,112,.07)}
  .api-defaults{display:flex;flex-wrap:wrap;gap:7px}
  .api-defaults button,.api-actions button{border:1px solid #dbe3de;background:#f7f9f8;border-radius:7px;
    min-height:32px;padding:0 11px;color:#4b5a53;font-size:11.5px;cursor:pointer}
  .api-defaults button:hover,.api-actions button:hover{background:#edf3f0;border-color:#c8d7d0}
  .api-defaults button.on{background:#e4f2ec;border-color:#a7c9bc;color:#1d6b55;font-weight:700}
  .api-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
  .api-actions .primary{background:#245d4d;border-color:#245d4d;color:#fff;font-weight:700}
  .api-actions .primary:hover{background:#1d4e40}
  .api-actions .danger{margin-left:auto;color:#99604e;border-color:#ead8d1;background:#fff8f5}
  .api-note{font-size:10.5px;color:#8a9690;line-height:1.6;margin-top:12px}
  .api-test-result{font-size:11px;color:#6f7c75;margin-left:2px;min-height:18px}
  .api-test-result.ok{color:#247259}.api-test-result.err{color:#a04c37}
  @media(max-width:800px){
    #modal{padding:8px}
    #modal .box{width:100%;height:96vh}
    .api-shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .api-rail{display:flex;gap:5px;padding:8px;border-right:none;border-bottom:1px solid #dce3df;overflow-x:auto}
    .api-rail-label,.api-rail-note{display:none}
    .api-filter{width:auto;flex:0 0 auto;height:34px;margin:0;padding:0 9px}
    .api-filter .count{display:none}
    .api-main{padding:16px}
    .api-top{display:block}
    .api-search{width:100%;margin-top:12px}
    .api-summary{grid-template-columns:1fr 1fr 1fr}
    .api-top,.api-summary,.api-grid,.api-card{width:100%;min-width:0}
    .api-grid{grid-template-columns:minmax(0,1fr)}
    .api-detail{padding:16px}
    .api-form-grid{grid-template-columns:1fr}
    .api-field.full{grid-column:auto}
  }

  #board{position:fixed;inset:0;z-index:65;background:rgba(244,246,250,.985);display:none;overflow:auto;padding:72px 24px 40px}
  #board.on{display:block}
  #board .bt{position:fixed;left:24px;top:18px;font-size:18px;font-weight:800;color:#1f2733;z-index:66}
  #board .bclose{position:fixed;right:20px;top:14px;z-index:66;border:none;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;box-shadow:var(--shadow)}
  #board .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;max-width:1200px;margin:0 auto}
  #board .bi{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
  #board .bi:hover{border-color:var(--accent)}
  #board .bi .bih{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12.5px;color:#fff;font-weight:600}
  #board .bi .bib{padding:8px;font-size:12px;color:#475569;white-space:pre-wrap;word-break:break-word}
  #board .bi img,#board .bi video{width:100%;display:block;background:#f1f5f9}
  #board .bi .no{background:rgba(0,0,0,.35);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;margin-right:2px}
  #board .empty{text-align:center;color:#94a3b8;padding:60px;font-size:14px}

  #runbar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:35;background:#111827;color:#fff;
    border-radius:10px;padding:6px 14px;font-size:13px;display:none;box-shadow:var(--shadow);align-items:center;gap:8px}
  #runbar.on{display:flex}
  #runbar .pbar{width:120px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
  #runbar .pbar i{display:block;height:100%;background:#4ade80;width:0}

  #zoominfo{position:fixed;right:12px;bottom:12px;z-index:30;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:5px 9px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
  #zoominfo button{border:none;background:#f1f4f9;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:15px}
  #hint{position:fixed;left:12px;bottom:12px;z-index:30;color:var(--muted);font-size:11.5px;
    background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:10px;padding:5px 9px;max-width:60vw}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);z-index:90;
    background:#111827;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;

/* =========================================================================
   2) 多厂商 API 适配层（可插拔）
   统一协议：provider.run(ctx) -> {kind, url?, b64?, text?, note?}
   ctx = { kind, model, prompt, inputs:[{kind,url,b64,text}], params, cfg }
   同步厂商用 makeHttp；异步厂商传 async:true + pollUrl/pollParse
   ========================================================================= */
var PROVIDERS={};
function registerProvider(p){PROVIDERS[p.id]=p;}

function makeHttp(spec){
  var p=Object.assign({},spec);
  p.run=async function(ctx){
    if(!spec.endpoint) throw new Error("「"+spec.label+"」适配器待完善：请在源码 PROVIDERS 里补 endpoint/parse（或先改用「本地模拟」）");
    var cfg=Object.assign({},spec.defaults||{},ctx.cfg||{});
    var ep=spec.endpoint(ctx,cfg);
    var r=await fetch(ep.url,{method:ep.method||"POST",headers:ep.headers||{"Content-Type":"application/json"},body:ep.body});
    if(!r.ok) throw new Error("HTTP "+r.status+"："+(await r.text()).slice(0,300));
    var j=await r.json();
    var out=spec.parse(j,ctx,cfg);
    if(spec.async){
      if(!out||!out.taskId) return out;
      var maxP=spec.maxPolls||90, iv=spec.pollInterval||2000;
      for(var i=0;i<maxP;i++){
        await sleep(iv);
        var pu=spec.pollUrl(out.taskId,ctx,cfg);
        var pr=await fetch(pu.url,{method:"GET",headers:pu.headers||{}});
        var pj=await pr.json();
        var st=spec.pollParse(pj,ctx,cfg);
        if(st.status==="done") return st.result;
        if(st.status==="error") throw new Error(st.message||"生成失败");
      }
      throw new Error("轮询超时");
    }
    return out;
  };
  return p;
}

function sizeOf(ratio){return {"16:9":"1280x720","9:16":"720x1280","1:1":"1024x1024","3:4":"768x1024","4:3":"1024x768"}[ratio]||"1024x1024";}
function joinApiPath(base,path){
  base=String(base||"").trim().replace(/\/+$/,"");
  path=String(path||"");
  if(/\/v1$/i.test(base)&&/^\/v1(?:\/|$)/i.test(path))return base+path.replace(/^\/v1/i,"");
  return base+path;
}
function oaiImageSpec(id,label,baseUrl,defModel,meta){
  return Object.assign({id:id,label:label,kinds:["image"],group:"cloud",icon:label.slice(0,1),accent:"#334155",testPath:"/v1/models",

      headers:{"Content-Type":"application/json","Authorization":"Bearer "+(cfg.apiKey||"")},
      body:JSON.stringify({model:ctx.model||cfg.model,prompt:ctx.prompt,n:1,size:sizeOf(ctx.params&&ctx.params.ratio),response_format:"b64_json"})};},
    parse:function(j){var d=(j.data&&j.data[0])||{};return {kind:"image",b64:d.b64_json,url:d.url};}},meta||{});
}

registerProvider({
  id:"custom-openai",label:"自定义 OpenAI 兼容",kinds:["text","image"],
  icon:"＋",accent:"#0f766e",group:"custom",testPath:"/v1/models",
  description:"为其他厂商预留的通用接入模板，支持文本对话与图像生成，可填写独立模型名和额外请求头。",
  help:"Base URL 可填写到域名或 /v1。文本调用 /chat/completions，图像调用 /images/generations。浏览器直连要求厂商允许 CORS。",
  defaults:{baseUrl:"",apiKey:"",model_text:"",model_image:"",extraHeaders:""},
  fields:[
    {k:"baseUrl",l:"Base URL",ph:"https://api.example.com/v1"},
    {k:"apiKey",l:"API Key",pw:1},
    {k:"model_text",l:"文本模型",ph:"例如 deepseek-chat"},
    {k:"model_image",l:"图像模型",ph:"例如 gpt-image-1"},
    {k:"extraHeaders",l:"额外请求头 JSON（可选）",t:"textarea",ph:'{"X-Custom-Header":"value"}'}
  ],
  models:{text:[],image:[]},
  async run(ctx){
    var cfg=Object.assign({},this.defaults,ctx.cfg||{});
    if(!cfg.baseUrl)throw new Error("请先填写自定义服务的 Base URL");
    if(!cfg.apiKey)throw new Error("请先填写自定义服务的 API Key");
    var headers={"Content-Type":"application/json",Authorization:"Bearer "+cfg.apiKey};
    if(cfg.extraHeaders&&cfg.extraHeaders.trim()){
      try{Object.assign(headers,JSON.parse(cfg.extraHeaders));}
      catch(_){throw new Error("额外请求头不是有效的 JSON");}
    }
    if(ctx.kind==="text"){
      var tm=ctx.model||cfg.model_text;
      if(!tm)throw new Error("请先填写文本模型");
      var tr=await fetch(joinApiPath(cfg.baseUrl,"/v1/chat/completions"),{
        method:"POST",headers:headers,
        body:JSON.stringify({model:tm,messages:[{role:"user",content:ctx.prompt||""}],temperature:0.7})
      });
      if(!tr.ok)throw new Error("HTTP "+tr.status+"："+(await tr.text()).slice(0,400));
      var tj=await tr.json(),choice=tj.choices&&tj.choices[0];
      if(!choice)throw new Error("接口响应中没有 choices");
      return {kind:"text",text:(choice.message&&choice.message.content)||choice.text||"",note:"自定义 OpenAI 兼容 · "+tm};
    }
    if(ctx.kind==="image"){
      var im=ctx.model||cfg.model_image;
      if(!im)throw new Error("请先填写图像模型");
      var ir=await fetch(joinApiPath(cfg.baseUrl,"/v1/images/generations"),{
        method:"POST",headers:headers,
        body:JSON.stringify({model:im,prompt:ctx.prompt,n:1,size:sizeOf(ctx.params&&ctx.params.ratio),response_format:"b64_json"})
      });
      if(!ir.ok)throw new Error("HTTP "+ir.status+"："+(await ir.text()).slice(0,400));
      var ij=await ir.json(),image=(ij.data&&ij.data[0])||{};
      if(!image.url&&!image.b64_json)throw new Error("接口响应中没有图片数据");
      return {kind:"image",url:image.url,b64:image.b64_json,note:"自定义 OpenAI 兼容 · "+im};
    }
    throw new Error("自定义模板暂不支持该生成类型");
  }
});

registerProvider({
  id:"comfy",label:"ComfyUI 本地",kinds:["image"],
  icon:"C",accent:"#16a34a",group:"local",
  description:"连接本机或局域网 ComfyUI；支持自动读取 checkpoint、内置工作流和自定义 API 工作流。",
  help:"支持内置文生图工作流，也可填写 ComfyUI 的 API 格式工作流。自定义 JSON 可用 {{prompt}}、{{negative_prompt}}、{{checkpoint}}、{{width}}、{{height}}、{{seed}}、{{steps}}、{{cfg}} 作为输入占位符。",
  defaults:{baseUrl:"http://127.0.0.1:8188",checkpoint:"",negativePrompt:"low quality, blurry, bad anatomy, extra fingers, watermark, text",workflow:""},
  fields:[
    {k:"baseUrl",l:"ComfyUI 地址"},
    {k:"checkpoint",l:"默认模型（留空自动选择）"},
    {k:"negativePrompt",l:"反向提示词",t:"textarea"},
    {k:"workflow",l:"自定义 API 工作流 JSON（留空使用内置工作流）",t:"textarea"}
  ],
  async run(ctx){
    var cfg=ctx.cfg||{},base=(cfg.baseUrl||"http://127.0.0.1:8188").trim().replace(/\/+$/,""),origin;
    try{origin=new URL(base).origin;}catch(_){throw new Error("ComfyUI 地址无效，请填写例如 http://127.0.0.1:8188");}
    if(!/^https?:$/.test(new URL(base).protocol))throw new Error("ComfyUI 地址必须使用 HTTP 或 HTTPS");
    async function request(path,options){
      var response;
      try{response=await fetch(base+path,options||{});}catch(e){
        throw new Error("无法访问本机 ComfyUI（"+base+"）。请确认 ComfyUI 正在运行；若页面来自 GitHub Pages，还需在 ComfyUI 中仅允许网页来源 https://zty8889-oss.github.io。浏览器的跨域或本地网络权限也可能拦截请求。");
      }
      if(!response.ok){var detail="";try{detail=(await response.text()).slice(0,500);}catch(_){}
        if(response.status===403)throw new Error("ComfyUI 拒绝了跨域请求。需在 ComfyUI 启动参数中允许网页来源 https://zty8889-oss.github.io（不要使用 *），然后重启 ComfyUI。"+(detail?"："+detail:""));
        throw new Error("ComfyUI 返回 HTTP "+response.status+(detail?"："+detail:""));
      }
      return response.json();
    }
    var info=await request("/object_info/CheckpointLoaderSimple"),nodeInfo=info&&info.CheckpointLoaderSimple;
    var choices=nodeInfo&&nodeInfo.input&&nodeInfo.input.required&&nodeInfo.input.required.ckpt_name&&nodeInfo.input.required.ckpt_name[0]||[];
    if(!choices.length)throw new Error("ComfyUI 没有可用的 checkpoint 模型，请先安装模型并刷新页面");
    var checkpoint=ctx.model||cfg.checkpoint||choices.find(function(x){return /meina|animagine|anime/i.test(x);})||choices[0];
    if(choices.indexOf(checkpoint)<0)throw new Error("找不到模型「"+checkpoint+"」。可用模型："+choices.slice(0,8).join("、"));
    var ratio=(ctx.params&&ctx.params.ratio)||"1:1",dims={"1:1":[512,512],"3:4":[512,680],"4:3":[680,512],"9:16":[432,768],"16:9":[768,432]},size=dims[ratio]||dims["1:1"];
    var seed=Math.floor(Math.random()*100000000000000),steps=Math.max(1,Math.min(60,parseInt(cfg.steps,10)||20)),cfgScale=Math.max(1,Math.min(20,parseFloat(cfg.cfgScale)||7));
    var promptGraph;
    if(cfg.workflow&&cfg.workflow.trim()){
      try{promptGraph=JSON.parse(cfg.workflow);}catch(e){throw new Error("自定义工作流 JSON 格式错误："+e.message);}
      if(promptGraph&&promptGraph.prompt)promptGraph=promptGraph.prompt;
      var replacements={"{{prompt}}":ctx.prompt||"","{{negative_prompt}}":cfg.negativePrompt||"","{{checkpoint}}":checkpoint,"{{width}}":size[0],"{{height}}":size[1],"{{seed}}":seed,"{{steps}}":steps,"{{cfg}}":cfgScale};
      function substitute(v){if(typeof v==="string")return replacements[v]!==undefined?replacements[v]:v;if(Array.isArray(v))return v.map(substitute);if(v&&typeof v==="object"){Object.keys(v).forEach(function(k){v[k]=substitute(v[k]);});return v;}return v;}
      promptGraph=substitute(promptGraph);
      if(!promptGraph||typeof promptGraph!=="object"||!Object.keys(promptGraph).length)throw new Error("自定义工作流中没有 ComfyUI API 节点");
    }else{
      promptGraph={
        "1":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":checkpoint}},
        "2":{"class_type":"CLIPTextEncode","inputs":{"text":ctx.prompt||"high quality anime illustration","clip":["1",1]}},
        "3":{"class_type":"CLIPTextEncode","inputs":{"text":cfg.negativePrompt||"","clip":["1",1]}},
        "4":{"class_type":"EmptyLatentImage","inputs":{"width":size[0],"height":size[1],"batch_size":1}},
        "5":{"class_type":"KSampler","inputs":{"seed":seed,"steps":steps,"cfg":cfgScale,"sampler_name":"euler","scheduler":"normal","denoise":1,"model":["1",0],"positive":["2",0],"negative":["3",0],"latent_image":["4",0]}},
        "6":{"class_type":"VAEDecode","inputs":{"samples":["5",0],"vae":["1",2]}},
        "7":{"class_type":"SaveImage","inputs":{"filename_prefix":"infinite-canvas","images":["6",0]}}
      };
    }
    var queued=await request("/prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:promptGraph,client_id:"infinite-canvas-"+Math.random().toString(36).slice(2)})});
    if(!queued.prompt_id)throw new Error("ComfyUI 未返回任务编号"+(queued.node_errors?"："+JSON.stringify(queued.node_errors).slice(0,400):""));
    var history;
    for(var attempt=0;attempt<240;attempt++){
      await new Promise(function(resolve){setTimeout(resolve,1500);});
      var result=await request("/history/"+encodeURIComponent(queued.prompt_id));
      history=result&&result[queued.prompt_id];if(history)break;
    }
    if(!history)throw new Error("等待 ComfyUI 生成超时，请检查队列或服务器状态");
    var images=[];Object.keys(history.outputs||{}).some(function(id){var list=history.outputs[id]&&history.outputs[id].images;if(list&&list.length){images=list;return true;}return false;});
    if(!images.length){var status=history.status&&history.status.messages;throw new Error("工作流已结束，但没有返回图片"+(status?"："+JSON.stringify(status).slice(0,400):""));}
    var image=images[0],view=new URL(origin+"/view");view.searchParams.set("filename",image.filename);view.searchParams.set("subfolder",image.subfolder||"");view.searchParams.set("type",image.type||"output");
    return {kind:"image",url:view.href,note:"ComfyUI 本地生成 · "+checkpoint,provider:"comfy"};
  }
});

function applyView(){
  world.style.transform="translate("+state.view.x+"px,"+state.view.y+"px) scale("+state.view.s+")";
  var g=GRID*state.view.s;
  vp.style.backgroundSize=g+"px "+g+"px,"+g+"px "+g+"px,"+(g*4)+"px "+(g*4)+"px,"+(g*4)+"px "+(g*4)+"px";
  vp.style.backgroundPosition=state.view.x+"px "+state.view.y+"px,"+state.view.x+"px "+state.view.y+"px,"+
    state.view.x+"px "+state.view.y+"px,"+state.view.x+"px "+state.view.y+"px";
  ztext.textContent=Math.round(state.view.s*100)+"%";
}
function s2w(cx,cy){return {x:(cx-state.view.x)/state.view.s,y:(cy-state.view.y)/state.view.s};}
function zoomAt(cx,cy,f){var s0=state.view.s,s1=Math.min(4,Math.max(0.12,s0*f));if(s1===s0)return;
  var w=s2w(cx,cy);state.view.s=s1;state.view.x=cx-w.x*s1;state.view.y=cy-w.y*s1;applyView();saveSoon();}

/* =========================================================================
   4) 渲染：分组框 / 节点 / 连线
   ========================================================================= */
function nodeById(i){for(var k=0;k<state.nodes.length;k++)if(state.nodes[k].id===i)return state.nodes[k];return null;}
function portPos(n,which){return {x:which==="in"?n.x:n.x+n.w, y:n.y+34};}
function groups(){return state.nodes.filter(function(n){return n.type==="group";});}
function childrenOf(g){return state.nodes.filter(function(o){return o.type!=="group"&&o.id!==g.id&&
  (o.x+o.w/2)>g.x&&(o.x+o.w/2)<g.x+g.w&&(o.y+(o.h||150)/2)>g.y&&(o.y+(o.h||150)/2)<g.y+g.h;});}
function collapsedGroups(){return groups().filter(function(g){return g.collapsed;});}
function isHidden(n){return collapsedGroups().some(function(g){return childrenOf(g).some(function(c){return c.id===n.id;});});}

function renderAll(){
  nodesEl.innerHTML="";
  groups().forEach(function(g){nodesEl.appendChild(groupEl(g));});      // 分组框在下层
  state.nodes.forEach(function(n){if(n.type!=="group"&&!isHidden(n))nodesEl.appendChild(nodeEl(n));});
  drawWires();
}
function drawWires(){
  edgesEl.querySelectorAll("path.wire").forEach(function(p){p.remove();});
  var h="";
  state.links.forEach(function(l){
    var a=nodeById(l.from),b=nodeById(l.to);if(!a||!b)return;
    if(isHidden(a)||isHidden(b))return;
    var p1=portPos(a,"out"),p2=portPos(b,"in");
    h+='<path class="wire" d="'+wire(p1,p2)+'" marker-end="url(#arw)"/>';
  });
  edgesEl.insertAdjacentHTML("beforeend",h);
}
function wire(p1,p2){var dx=Math.max(50,Math.abs(p2.x-p1.x)*0.5);
  return "M"+p1.x+","+p1.y+" C"+(p1.x+dx)+","+p1.y+" "+(p2.x-dx)+","+p2.y+" "+p2.x+","+p2.y;}

function groupEl(g){
  var c=el("div","gframe");c.dataset.id=g.id;
  c.style.left=g.x+"px";c.style.top=g.y+"px";c.style.width=g.w+"px";c.style.height=(g.collapsed?42:g.h)+"px";
  if(g.color)c.style.background=g.color;
  var hd=el("div","ghd");
  hd.innerHTML='<span>🗂</span><span class="gti">'+esc(g.title||"分组")+'</span><span class="gcount">'+childrenOf(g).length+'</span>';
  var col=el("button","gbtn");col.textContent=g.collapsed?"▸":"▾";col.title="折叠/展开";
  col.addEventListener("pointerdown",function(e){e.stopPropagation();});
  col.addEventListener("click",function(e){e.stopPropagation();checkpoint();g.collapsed=!g.collapsed;renderAll();save();});
  var del=el("button","gbtn");del.textContent="×";del.title="解散分组（保留节点）";
  del.addEventListener("pointerdown",function(e){e.stopPropagation();});

  var hh=el("span","ghandle");c.appendChild(hh);
  c.addEventListener("pointerdown",onGroupDown);
  return c;

function onGroupDown(e){
  var c=e.currentTarget,g=nodeById(c.dataset.id);if(!g)return;
  if(e.target.closest(".gbtn"))return;
  e.stopPropagation();select(g.id);checkpoint();
  if(e.target.classList.contains("ghandle")){
    drag={type:"gresize",n:g,el:c,sx:e.clientX,sy:e.clientY,w0:g.w,h0:g.h};vp.setPointerCapture(e.pointerId);return;
  }
  var kids=childrenOf(g).map(function(k){return {n:k,x0:k.x,y0:k.y};});
  drag={type:"gmove",n:g,el:c,kids:kids,sx:e.clientX,sy:e.clientY,x0:g.x,y0:g.y};
  vp.setPointerCapture(e.pointerId);

function statusClass(s){return s==="running"?"run":s==="done"?"done":s==="error"?"err":"";}
function nodeEl(n){
  var dt=NODETYPES[n.type]||{label:n.type,icon:"⬛",color:"#64748b",kind:"any"};
  var c=el("div","nd"+(n.collapsed?" collapsed":""));c.dataset.id=n.id;

    '<span class="st '+statusClass(n.status)+'"></span>';
  var colb=el("button","col");colb.textContent=n.collapsed?"▸":"▾";colb.title="折叠/展开";
  colb.addEventListener("pointerdown",function(e){e.stopPropagation();});

  hd.appendChild(colb);

  c.addEventListener("pointerdown",onNodeDown);
  return c;
}
function summary(n){
  var dt=NODETYPES[n.type];var p=n.params||{};
  if(n.type==="script")return "题材："+(p.topic||"—")+"\n类型："+(p.genre||"")+"　集数："+(p.eps||1);
  if(n.type==="charview")return (p.desc||"角色")+"\n画风："+(p.style||"")+"　"+(p.ratio||"");
  if(n.type==="scene")return (p.desc||"场景")+"\n"+(p.style||"")+"　"+(p.ratio||"");
  if(n.type==="image")return (p.prompt||"（待填提示词）")+"\n"+(p.ratio||"");
  if(n.type==="video")return (p.motion||"自然运镜")+"\n时长："+(p.dur||5)+"s　"+(p.ratio||"");
  if(n.type==="audio")return (p.text||"（取上游文本）").slice(0,80);
  if(n.type==="text")return (p.text||"");
  if(n.type==="upload")return n.output&&n.output.url?"已上传":"点击下方按钮上传图片";
  return dt?dt.label:"";

function renderResult(box,n){
  box.innerHTML="";var o=n.output;if(!o)return;
  if(o.kind==="image"&&(o.url||o.b64)){var im=el("img");im.src=o.url||("data:image/png;base64,"+o.b64);im.draggable=false;box.appendChild(im);}
  else if(o.kind==="video"){
    if(o.url){var v=el("video");v.src=o.url;v.controls=true;box.appendChild(v);}
    else{var d=el("div","txtout");d.textContent=o.note||"视频待生成";box.appendChild(d);}
  } else if(o.kind==="audio"){
    var ab=el("button","run");ab.style.padding="6px";ab.textContent="▶ 朗读预览";
    ab.addEventListener("click",function(e){e.stopPropagation();speak(o.text||"");});box.appendChild(ab);
    if(o.url){var au=el("audio");au.src=o.url;au.controls=true;box.appendChild(au);}
  } else if(o.text){var t=el("div","txtout");t.textContent=o.text;box.appendChild(t);}
  if(o.note){var nn=el("div");nn.style.cssText="font-size:10px;color:#94a3b8;margin-top:4px";nn.textContent=o.note;box.appendChild(nn);}

function providerLabel(n){
  var kind=(NODETYPES[n.type]||{}).kind;

function speak(text){
  if(!text){toast("没有文本");return;}
  if(!("speechSynthesis"in window)){toast("本机不支持浏览器TTS");return;}
  var u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";speechSynthesis.speak(u);

function refresh(n){
  var old=nodesEl.querySelector('[data-id="'+n.id+'"]');if(!old)return;
  var e=(n.type==="group")?groupEl(n):nodeEl(n);

function makeParams(type){var m={};(NODETYPES[type].fields||[]).forEach(function(f){m[f.k]=f.def!==undefined?f.def:"";});return m;}

  var n={id:id(),type:type,title:dt.label,x:x,y:y,w:230,h:150,params:makeParams(type),
    provider:"",model:"",status:"idle",output:null,log:""};

function addGroup(x,y){
  checkpoint();
  var g={id:id("g"),type:"group",title:"新分组",x:(x||0)-40,y:(y||0)-40,w:560,h:360,color:"",collapsed:false};

function ungroup(gid){
  state.nodes=state.nodes.filter(function(n){return n.id!==gid;});
  if(selectedId===gid){selectedId=null;closeInspector();}
  renderAll();save();toast("已解散分组（节点保留）");

function removeNode(nid){
  checkpoint();
  state.nodes=state.nodes.filter(function(n){return n.id!==nid;});
  state.links=state.links.filter(function(l){return l.from!==nid&&l.to!==nid;});
  if(selectedId===nid){selectedId=null;closeInspector();}
  renderAll();save();

function select(i){
  selectedId=i;
  [].forEach.call(nodesEl.children,function(e){e.classList.toggle("selected",e.dataset.id===i);});
  if(i)openInspector(nodeById(i));else closeInspector();

var spacePan=false;

window.addEventListener("blur",function(){spacePan=false;});
vp.addEventListener("pointerdown",function(e){
  if(e.target.closest("#toolbar")||e.target.closest("#inspector")||e.target.closest("#menu")||e.target.closest("#zoominfo")||e.target.closest("#board"))return;
  if(!spacePan&&e.button!==1)return;

  drag={type:"pan",sx:e.clientX,sy:e.clientY,ox:state.view.x,oy:state.view.y};

async function runNode(nid,opts){
  opts=opts||{};

  var dt=NODETYPES[n.type];if(!dt)return;
  var kind=dt.kind;

  var provider=PROVIDERS[pid];if(!provider){if(!opts.quiet)toast("未找到厂商："+pid);return;}if(provider.available===false){if(!opts.quiet)toast("该服务商适配尚未完成");return;}checkpoint();
  n.status="running";n.log="请求 "+provider.label+"…";refresh(n);if(selectedId===nid)openInspector(n);
  try{
    var ctx={kind:kind,model:n.model||"",prompt:buildPrompt(n),inputs:gatherInputs(n),params:n.params||{},cfg:(state.settings.providers[pid]||{})};
    var res=await provider.run(ctx);
    n.output=res;n.status="done";n.log="完成 @"+new Date().toLocaleTimeString();
  }catch(err){
    n.status="error";n.log="失败："+(err&&err.message?err.message:err);
    if(!opts.quiet)toast("生成失败："+(err&&err.message?err.message:err));
  }
  refresh(n);if(selectedId===nid)openInspector(n);save();
}

/* ---- 拓扑排序 / 分层 / 批跑 ---- */
function workingNodes(){return state.nodes.filter(function(n){return n.type!=="group";});}
function topoSort(){
  var ns=workingNodes(),byId={};ns.forEach(function(n){byId[n.id]=n;});
  var indeg={},adj={};ns.forEach(function(n){indeg[n.id]=0;adj[n.id]=[];});
  state.links.forEach(function(l){if(byId[l.from]&&byId[l.to]){adj[l.from].push(l.to);indeg[l.to]++;}});
  var q=ns.filter(function(n){return indeg[n.id]===0;}).map(function(n){return n.id;}),out=[];
  while(q.length){var u=q.shift();out.push(u);adj[u].forEach(function(v){if(--indeg[v]===0)q.push(v);});}
  if(out.length<ns.length)ns.forEach(function(n){if(out.indexOf(n.id)<0)out.push(n.id);});
  return out.map(function(i){return byId[i];});
}
function levelize(order){
  var lvl={},byId={};order.forEach(function(n){byId[n.id]=n;lvl[n.id]=0;});
  var adj={};order.forEach(function(n){adj[n.id]=[];});
  state.links.forEach(function(l){if(byId[l.from]&&byId[l.to])adj[l.from].push(l.to);});
  order.forEach(function(n){adj[n.id].forEach(function(v){lvl[v]=Math.max(lvl[v],lvl[n.id]+1);});});
  var levels=[];order.forEach(function(n){var L=lvl[n.id];(levels[L]=levels[L]||[]).push(n);});
  return levels.filter(function(x){return x&&x.length;});
}
var runAllFlag={running:false,cancel:false};
function setRunBtn(){
  var b=document.querySelector('#toolbar button[data-act="runall"]');
  if(b)b.textContent=runAllFlag.running?"⏹ 停止":"▶▶ 一键运行";
}
function setProgress(done,total,label){
  if(!runAllFlag.running){runbar.classList.remove("on");return;}
  runbar.classList.add("on");
  runbarText.textContent=(label||"运行中")+" "+done+"/"+total;
  runbarBar.style.width=(total?Math.round(done/total*100):0)+"%";
}
async function runAll(){
  if(runAllFlag.running){runAllFlag.cancel=true;runbarText.textContent="正在停止…";return;}
  var order=topoSort();if(!order.length){toast("没有可运行的节点");return;}
  var levels=levelize(order);
  runAllFlag.running=true;runAllFlag.cancel=false;setRunBtn();
  var done=0,total=order.length;setProgress(done,total,"开始");
  for(var i=0;i<levels.length;i++){
    if(runAllFlag.cancel)break;
    await Promise.all(levels[i].map(function(n){return runNode(n.id,{quiet:true});}));
    done+=levels[i].length;setProgress(done,total);
  }
  runAllFlag.running=false;setRunBtn();setProgress(done,total,"完成");
  setTimeout(function(){runbar.classList.remove("on");},1200);
  toast(runAllFlag.cancel?("已停止（"+done+"/"+total+"）"):("全部完成（"+done+"/"+total+"）"));
}
async function runBranch(startId){
  var byId={};workingNodes().forEach(function(n){byId[n.id]=n;});
  var reach={},stack=[startId];
  while(stack.length){var u=stack.pop();if(reach[u])continue;reach[u]=1;
    state.links.forEach(function(l){if(l.from===u&&byId[l.to])stack.push(l.to);});}
  var order=topoSort().filter(function(n){return reach[n.id];});
  var levels=levelize(order);
  toast("运行分支（"+order.length+"个节点）");
  for(var i=0;i<levels.length;i++){
    await Promise.all(levels[i].map(function(n){return runNode(n.id,{quiet:true});}));
    setProgress(0,0);
  }
}

function fitView(){
  if(!state.nodes.length){state.view={x:0,y:0,s:1};applyView();return;}
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  state.nodes.forEach(function(n){minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x+n.w);maxy=Math.max(maxy,n.y+(n.h||160));});
  var pad=80,rightInset=inspector.classList.contains("open")?Math.min(320,innerWidth*.88):0,W=innerWidth-rightInset-2*pad,H=innerHeight-2*pad;
  var s=Math.min(1.3,Math.max(0.15,Math.min(W/(maxx-minx),H/(maxy-miny))));
  state.view.s=s;state.view.x=pad-minx*s+(W-(maxx-minx)*s)/2;state.view.y=pad-miny*s+(H-(maxy-miny)*s)/2;
  applyView();save();
}

  if(p.group==="local")return !!String(cfg.baseUrl||defaults.baseUrl||"").trim();

async function testProviderConnection(pid,resultEl){
  var p=PROVIDERS[pid],cfg=state.settings.providers[pid]||{},defaults=p.defaults||{};
  resultEl.className="api-test-result";resultEl.textContent="正在检查连接…";
  if(pid==="mock"){resultEl.classList.add("ok");resultEl.textContent="本地模拟无需网络连接，可正常使用。";return;}
  if(p.available===false){resultEl.classList.add("err");resultEl.textContent="该服务商的专用适配器尚未完成。";return;}
  var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},9000);
  try{
    if(pid==="comfy"){
      var base=String(cfg.baseUrl||defaults.baseUrl||"").replace(/\/+$/,"");
      if(!base)throw new Error("请先填写 ComfyUI 地址");
      var cr=await fetch(base+"/system_stats",{signal:controller.signal});
      if(!cr.ok)throw new Error("HTTP "+cr.status);
      var cj=await cr.json(),dev=(cj.devices&&cj.devices[0])||{};
      resultEl.classList.add("ok");resultEl.textContent="ComfyUI 已连接"+(dev.name?" · "+dev.name:"");
      return;
    }
    var key=String(cfg.apiKey||"").trim();
    if(!key)throw new Error("请先填写 API Key");
    var baseUrl=String(cfg.baseUrl||defaults.baseUrl||"").replace(/\/+$/,"");
    if(!baseUrl)throw new Error("请先填写 Base URL");
    var headers={Authorization:"Bearer "+key};
    var response=await fetch(joinApiPath(baseUrl,p.testPath||"/v1/models"),{headers:headers,signal:controller.signal});
    if(!response.ok)throw new Error("HTTP "+response.status+"，请检查地址、Key 和模型权限");
    var data=await response.json();
    var count=data&&Array.isArray(data.data)?data.data.length:0;
    resultEl.classList.add("ok");resultEl.textContent="连接成功"+(count?" · 可读取 "+count+" 个模型":"");
  }catch(err){
    resultEl.classList.add("err");
    resultEl.textContent=err.name==="AbortError"?"连接超时，请检查地址或跨域设置":(err.message||"连接失败")+"；云端接口可能未开放浏览器跨域访问";
  }finally{clearTimeout(timer);}
}

function validateWorkflowData(d){
  if(!d||typeof d!=="object"||!Array.isArray(d.nodes)||!Array.isArray(d.links))throw new Error("缺少有效的 nodes 或 links 列表");
  if(d.nodes.length>1500||d.links.length>5000)throw new Error("工作流项目数量超出限制");
  var ids=Object.create(null),nodes=d.nodes.map(function(n){
    if(!n||typeof n!=="object"||(!NODETYPES[n.type]&&n.type!=="group")||typeof n.id!=="string"||! /^[A-Za-z0-9_-]{1,80}$/.test(n.id)||ids[n.id])throw new Error("节点类型或编号无效");
    ids[n.id]=1;["x","y","w","h"].forEach(function(k){if(n[k]!=null&&(!Number.isFinite(Number(n[k]))||Math.abs(Number(n[k]))>10000000))throw new Error("节点坐标或尺寸无效");});
    var copy=Object.assign({},n);if(!copy.params||typeof copy.params!=="object")copy.params={};return copy;
  });
  var links=d.links.filter(function(l){return l&&ids[l.from]&&ids[l.to]&&l.from!==l.to;}).map(function(l){return {id:String(l.id||id("l")),from:l.from,to:l.to};});
  var v=d.view||{},active=d.settings&&d.settings.active;return {nodes:nodes,links:links,view:{x:Number.isFinite(+v.x)?+v.x:0,y:Number.isFinite(+v.y)?+v.y:0,s:Math.max(.12,Math.min(4,Number.isFinite(+v.s)?+v.s:1))},active:active&&typeof active==="object"?active:null};
}
function load(){try{var raw=localStorage.getItem(STORE_KEY);if(!raw)return false;var d=JSON.parse(raw);var safe=validateWorkflowData(d);
  state.nodes=safe.nodes;state.links=safe.links;state.view=safe.view;if(d.settings)state.settings=Object.assign(state.settings,d.settings);return true;}catch(e){return false;}}
