name: Release Windows desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
      - name: Publish installer and update metadata together
        uses: softprops/action-gh-release@v2
        with:
          name: 无限画布 ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/InfiniteCanvas-*-Setup.exe
            dist/InfiniteCanvas-*-Setup.exe.blockmap
            dist/latest.yml
