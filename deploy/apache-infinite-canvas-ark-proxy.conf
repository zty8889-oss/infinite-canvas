ProxyRequests Off
SSLProxyEngine On

ProxyPassMatch ^/infinite-canvas/ark-proxy/(models|images/generations|contents/generations/tasks(?:/[A-Za-z0-9_-]+)?)$ https://ark.cn-beijing.volces.com/api/v3/$1

<LocationMatch "^/infinite-canvas/ark-proxy/">
    Require ip 192.168.2.0/24 127.0.0.1 ::1
    <LimitExcept GET POST>
        Require all denied
    </LimitExcept>
</LocationMatch>
